version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # The service surface returns the resource itself where that reads better —
    # GetScan and WatchScan return Scan, not GetScanResponse — and RetryAnalysis
    # deliberately shares AnalyzeScanResponse because a retry produces exactly
    # the same thing an analysis does. Both are settled contract decisions, so
    # the rules are turned off rather than annotated away one call at a time.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
