name: Release

# Publishing is driven by tags: push v1.2.3 and that becomes the image tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. v1.2.3)
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Skips the whole job cleanly when Docker Hub credentials are absent,
      # so a fork or an unconfigured repository does not fail on every tag.
      - name: Check credentials
        id: creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set; skipping the push."
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.creds.outputs.present == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.present == 'true'

      - uses: docker/login-action@v3
        if: steps.creds.outputs.present == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker tags
        id: meta
        if: steps.creds.outputs.present == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/automaton-sec
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        if: steps.creds.outputs.present == 'true'
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.v.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
