# Local docker-compose profile (security-api-pg). Development credentials only.
server:
  port: 5000
  shutdownGrace: 30s
database:
  type: postgres
  host: postgres
  port: 5432
  user: postgres
  password: postgres
  name: security_db
minio:
  endpoint: localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: securitymuaraenim
  region: us-east-1
  useSSL: false
openai:
  apiKey: ""
  model: gpt-4.1-mini
auth:
  # Local development only. Set webhookHmacKey/apiKeys and flip this to false
  # for anything reachable by another machine.
  disabled: true
cors:
  allowedOrigins: []
scanner:
  maxConcurrent: 2
  timeout: 30m
  allowPrivateTargets: false
  allowedHosts: []
  workspaceRoot: /app/workspace
